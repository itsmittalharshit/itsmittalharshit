<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="1200" height="175" role="img" aria-label="Toolkit: Python, PyTorch, TensorFlow, scikit-learn, SQL, C++, Docker, Git, Flutter, TFLite, Azure AI, Kubernetes, vision transformers, on-device ML, MLOps and CI/CD">
  <title>Toolkit</title>

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38a9e4" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38a9e4" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#0b6fa4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b6fa4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .label { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0b6fa4; }
    .head  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700;
             letter-spacing: 3.5px; fill: #6d8496; }
    .box   { fill: #f2f8fc; stroke: #b9dcf1; stroke-width: 1.2; }
  </style>

  <text class="head" x="4" y="18">TOOLKIT</text>

  <rect x="0" y="30" width="1200" height="2" rx="1" fill="url(#rule)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- row 1 -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="0.7s" fill="freeze"/>
    <rect class="box" x="0" y="52" width="120" height="40" rx="20"/>
    <text class="label" x="60" y="77" text-anchor="middle">Python</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.14;1" dur="0.8s" fill="freeze"/>
    <rect class="box" x="132" y="52" width="126" height="40" rx="20"/>
    <text class="label" x="195" y="77" text-anchor="middle">PyTorch</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.22;1" dur="0.9s" fill="freeze"/>
    <rect class="box" x="270" y="52" width="152" height="40" rx="20"/>
    <text class="label" x="346" y="77" text-anchor="middle">TensorFlow</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.29;1" dur="1s" fill="freeze"/>
    <rect class="box" x="434" y="52" width="154" height="40" rx="20"/>
    <text class="label" x="511" y="77" text-anchor="middle">scikit-learn</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;1" dur="1.1s" fill="freeze"/>
    <rect class="box" x="600" y="52" width="92" height="40" rx="20"/>
    <text class="label" x="646" y="77" text-anchor="middle">SQL</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.2s" fill="freeze"/>
    <rect class="box" x="704" y="52" width="92" height="40" rx="20"/>
    <text class="label" x="750" y="77" text-anchor="middle">C++</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="1.3s" fill="freeze"/>
    <rect class="box" x="808" y="52" width="118" height="40" rx="20"/>
    <text class="label" x="867" y="77" text-anchor="middle">Docker</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" fill="freeze"/>
    <rect class="box" x="938" y="52" width="152" height="40" rx="20"/>
    <text class="label" x="1014" y="77" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- row 2 -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.54;1" dur="1.5s" fill="freeze"/>
    <rect class="box" x="0" y="108" width="112" height="40" rx="20"/>
    <text class="label" x="56" y="133" text-anchor="middle">Flutter</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.58;1" dur="1.6s" fill="freeze"/>
    <rect class="box" x="124" y="108" width="106" height="40" rx="20"/>
    <text class="label" x="177" y="133" text-anchor="middle">TFLite</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.62;1" dur="1.7s" fill="freeze"/>
    <rect class="box" x="242" y="108" width="128" height="40" rx="20"/>
    <text class="label" x="306" y="133" text-anchor="middle">Azure AI</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.66;1" dur="1.8s" fill="freeze"/>
    <rect class="box" x="382" y="108" width="216" height="40" rx="20"/>
    <text class="label" x="490" y="133" text-anchor="middle">Vision transformers</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7;1" dur="1.9s" fill="freeze"/>
    <rect class="box" x="610" y="108" width="168" height="40" rx="20"/>
    <text class="label" x="694" y="133" text-anchor="middle">On-device ML</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.74;1" dur="2s" fill="freeze"/>
    <rect class="box" x="790" y="108" width="180" height="40" rx="20"/>
    <text class="label" x="880" y="133" text-anchor="middle">MLOps &amp; CI/CD</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.78;1" dur="2.1s" fill="freeze"/>
    <rect class="box" x="982" y="108" width="108" height="40" rx="20"/>
    <text class="label" x="1036" y="133" text-anchor="middle">Git</text>
  </g>
</svg>
